name: 部署到线上

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 只在上游运行；fork 没有 DEPLOY_* secrets，跑这里只会失败
    if: github.repository == 'zp-home/dalian-nailong'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 打包（README、.github 等由 .gitattributes 排除）
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/site.tgz" HEAD
          tar -tzf "$RUNNER_TEMP/site.tgz"
          ls -l "$RUNNER_TEMP/site.tgz"

      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 上传并发布
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "dalian-deploy@${DEPLOY_HOST}" "${GITHUB_SHA}" < "$RUNNER_TEMP/site.tgz"
